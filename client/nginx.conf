server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: react-router owns paths like /topics/:id client-side, so
    # any request that doesn't match a real static file must still serve
    # index.html rather than 404 - otherwise a refresh or deep link into the
    # app breaks in the docker-compose stack.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
